version: '3.7'
services:
  jellyfin:
    image: jellyfin/jellyfin:12.2
    container_name: jellyfin
    user: 1000:1000
    ports:
    - 192.168.4.90:8096:8096
    volumes:
    - /srv/pi-server/config/jellyfin:/config
    - /srv/disk1/videos:/media/videos:ro
    restart: unless-stopped
  navidrome:
    image: pivault-music-pinned:82838e7fadf89382
    container_name: navidrome
    user: 1000:1000
    ports:
    - 192.168.4.90:4533:4533
    volumes:
    - /srv/pi-server/config/navidrome:/data
    - /media/snx/C29C87F99C87E66F/Server/Music:/music:ro
    restart: unless-stopped
    environment:
      ND_BASEURL: /music
      ND_UIWELCOMEMESSAGE: PiVault Music
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.27-ls406
    container_name: calibre-web
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: America/New_York
    ports:
    - 192.168.4.90:8083:8083
    volumes:
    - /srv/pi-server/config/calibre-web:/config
    - /media/snx/C29C87F99C87E66F/Server/Books:/books
    restart: unless-stopped
  arcade:
    image: arianrhodsandlot/retroassembly:v7.260906.1627
    container_name: pivault-arcade
    ports:
    - 192.168.4.90:8000:8000
    volumes:
    - /media/snx/C29C87F99C87E66F/Server/Atari5200:/app/data
    restart: unless-stopped
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    container_name: pivault-kiwix
    ports:
    - 192.168.4.90:8084:8080
    volumes:
    - /media/snx/C29C87F99C87E66F/Server/Kiwix:/data:ro
    command:
    - '*.zim'
    restart: unless-stopped
  syncthing:
    image: syncthing/syncthing:2.1.6
    container_name: pivault-syncthing
    hostname: pivault
    network_mode: host
    environment:
      PUID: '1000'
      PGID: '1000'
      STGUIADDRESS: 0.0.0.0:8384
    volumes:
    - /srv/pi-server/config/syncthing:/var/syncthing
    - /media/snx/C29C87F99C87E66F/Server/Sync:/var/syncthing/Sync
    restart: unless-stopped
  paperless-db:
    image: postgres:18
    container_name: pivault-paperless-db
    env_file:
    - /srv/pi-server/config/paperless/paperless.env
    volumes:
    - /srv/pi-server/config/paperless/postgres:/var/lib/postgresql
    restart: unless-stopped
  paperless-broker:
    image: valkey/valkey:9-alpine
    container_name: pivault-paperless-broker
    volumes:
    - /srv/pi-server/config/paperless/broker:/data
    restart: unless-stopped
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.3
    container_name: pivault-paperless
    depends_on:
    - paperless-db
    - paperless-broker
    ports:
    - 192.168.4.90:8085:8000
    env_file:
    - /srv/pi-server/config/paperless/paperless.env
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_URL: http://192.168.4.90:8085
      PAPERLESS_TIME_ZONE: America/New_York
      PAPERLESS_OCR_LANGUAGE: eng
      USERMAP_UID: '1000'
      USERMAP_GID: '1000'
    volumes:
    - /srv/pi-server/config/paperless/data:/usr/src/paperless/data
    - /media/snx/C29C87F99C87E66F/Server/Documents/Paperless/Archive:/usr/src/paperless/media
    - /media/snx/C29C87F99C87E66F/Server/Documents/Paperless/Inbox:/usr/src/paperless/consume
    - /media/snx/C29C87F99C87E66F/Server/Documents/Paperless/Export:/usr/src/paperless/export
    restart: unless-stopped
  vaultwarden:
    image: vaultwarden/server:1.37.4
    container_name: pivault-vaultwarden
    environment:
      DOMAIN: https://192.168.4.90
      SIGNUPS_ALLOWED: 'false'
    volumes:
    - /srv/pi-server/config/vaultwarden:/data
    restart: unless-stopped
    env_file:
    - /srv/pi-server/config/users/vaultwarden.env
  vault-https:
    image: caddy:2.11.7-alpine
    container_name: pivault-https
    depends_on:
    - vaultwarden
    ports:
    - 192.168.4.90:80:80
    - 192.168.4.90:443:443
    - 192.168.4.90:8443:8443/tcp
    volumes:
    - /srv/pi-server/config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    - /srv/pi-server/config/caddy/data:/data
    - /srv/pi-server/config/caddy/config:/config
    restart: unless-stopped
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.6.0
    container_name: pivault-homepage
    ports: []
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.4.90:8086,192.168.4.90:8443
      PUID: '1000'
      PGID: '1000'
    volumes:
    - /srv/pi-server/config/homepage:/app/config
    restart: unless-stopped
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.27.0
    container_name: pivault-homebox
    ports:
    - 192.168.4.90:8087:7745
    env_file:
    - /srv/pi-server/config/homebox/homebox.env
    environment:
      TZ: America/New_York
      HBOX_OPTIONS_ALLOW_REGISTRATION: 'false'
    volumes:
    - /srv/pi-server/config/homebox/data:/data
    restart: unless-stopped
  grocy:
    image: lscr.io/linuxserver/grocy:4.7.1
    container_name: pivault-grocy
    ports:
    - 192.168.4.90:9283:80
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: America/New_York
    volumes:
    - /srv/pi-server/config/grocy:/config
    restart: unless-stopped
  calendar-db:
    image: postgres:17-alpine
    container_name: pivault-calendar-db
    env_file:
    - /srv/pi-server/config/calendar/calendar.env
    volumes:
    - /srv/pi-server/config/calendar/postgres:/var/lib/postgresql/data
    restart: unless-stopped
  calendar:
    image: nextcloud:34.0.5-apache
    container_name: pivault-calendar
    depends_on:
    - calendar-db
    env_file:
    - /srv/pi-server/config/calendar/calendar.env
    environment:
      POSTGRES_HOST: calendar-db
      NEXTCLOUD_TRUSTED_DOMAINS: 192.168.4.90
      TZ: America/New_York
    ports:
    - 192.168.4.90:8088:80
    volumes:
    - ./calendar-no-jit.ini:/usr/local/etc/php/conf.d/zz-calendar-no-jit.ini:ro
    - /srv/pi-server/config/calendar/html:/var/www/html
    restart: unless-stopped
  calendar-cron:
    image: nextcloud:34.0.5-apache
    container_name: pivault-calendar-cron
    entrypoint: /cron.sh
    depends_on:
    - calendar
    env_file:
    - /srv/pi-server/config/calendar/calendar.env
    environment:
      POSTGRES_HOST: calendar-db
      TZ: America/New_York
    volumes:
    - /srv/pi-server/config/calendar/html:/var/www/html
    restart: unless-stopped
  pivault-users:
    image: pivault-users:e2120183f2a319aa
    container_name: pivault-users
    restart: unless-stopped
    user: 1000:1000
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 384m
    env_file:
    - /srv/pi-server/config/users/users.env
    environment:
      PIVAULT_NATIVE_CONFIG: /native.json
    volumes:
    - /srv/pi-server/config/users/data:/data
    - /srv/pi-server/config/notifications:/notifications
    - /srv/pi-server/config/users/native.json:/native.json:ro
    labels:
      org.pivault.managed: users-installer
