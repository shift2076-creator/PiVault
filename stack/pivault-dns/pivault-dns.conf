listen-address=127.0.0.1,192.168.4.90
bind-dynamic
no-resolv
no-hosts

# Keep home-network names local.
local=/home.arpa/
address=/pivault.home.arpa/192.168.4.90

# No upstream servers: PiVault is offline-forever and must not send
# queries to external resolvers. Names not served above are not forwarded.
cache-size=1000

user=nobody
group=nogroup
