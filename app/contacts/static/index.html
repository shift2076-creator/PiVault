<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacts</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="home" href="https://192.168.4.90:8443/">PiVault</a>
    <h1>Contacts</h1>
    <button id="new" type="button" class="primary">Add contact</button>
  </header>
  <main class="layout">
    <section class="panel list-pane" aria-label="Contacts">
      <input id="search" type="search" placeholder="Search contacts" aria-label="Search contacts">
      <ul id="list" class="contact-list"></ul>
      <p id="empty-list" class="empty" hidden>No contacts yet.</p>
    </section>
    <section class="panel editor-pane" aria-label="Contact details">
      <p id="placeholder" class="empty">Select a contact, or add a new one.</p>
      <form id="editor" autocomplete="off" hidden>
        <div class="grid two">
          <label>First name<input name="given"></label>
          <label>Last name<input name="family"></label>
          <label>Organization<input name="org"></label>
          <label>Job title<input name="title"></label>
        </div>
        <fieldset>
          <legend>Email</legend>
          <div id="emails" class="rows"></div>
          <button type="button" class="add" data-kind="emails">Add email</button>
        </fieldset>
        <fieldset>
          <legend>Phone</legend>
          <div id="phones" class="rows"></div>
          <button type="button" class="add" data-kind="phones">Add phone</button>
        </fieldset>
        <fieldset>
          <legend>Address</legend>
          <div class="grid two">
            <label class="wide">Street<input name="street"></label>
            <label>City<input name="city"></label>
            <label>State or region<input name="region"></label>
            <label>Postal code<input name="postal"></label>
            <label>Country<input name="country"></label>
          </div>
        </fieldset>
        <div class="grid two">
          <label>Website<input name="url" type="url"></label>
          <label>Birthday<input name="birthday" type="date"></label>
        </div>
        <label>Notes<textarea name="note" rows="4"></textarea></label>
        <div class="actions">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="cancel">Cancel</button>
          <button type="button" id="delete" class="danger">Delete</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </form>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
