services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    ports:
      - "192.168.4.151:8096:8096"
    volumes:
      - /srv/pi-server/config/jellyfin:/config
      - /media/snx/C29C87F99C87E66F/Server/Videos:/media/videos:ro
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "1000:1000"
    ports:
      - "192.168.4.151:4533:4533"
    environment:
      ND_LOGLEVEL: info
    volumes:
      - /srv/pi-server/config/navidrome:/data
      - /media/snx/C29C87F99C87E66F/Server/Music:/music:ro
    restart: unless-stopped
